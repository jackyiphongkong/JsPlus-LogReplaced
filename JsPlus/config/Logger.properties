# ============================================================================
# JsPlus-LogReplaced - engine logger configuration
# File: JsPlus/config/Logger.properties
# ----------------------------------------------------------------------------
# Parsed only by com.killcoding.log.* (LoggerFactory loads the file; LogRecord
# and Logger read the keys). Verified against the engine source: the log
# package reads 27 keys in total = 13 active below + 14 hidden optional keys
# listed at the bottom as comments.
#
# Encoding: UTF-8 WITHOUT BOM. A BOM would be glued to the first key name
# ("Level") and the key would silently never match.
# Key names must not contain spaces. Values are read verbatim - keep the units
# ("1s", "5mb", "30"), the engine converts them (getMilliSeconds/getFileSize).
# A commented-out key behaves exactly like an absent key: the code default
# applies; nothing below is enabled by being commented out.
# ============================================================================

# --- Basic ------------------------------------------------------------------
# Minimum level that is actually written: DEBUG / INFO / WARN / ERROR / MARK
# (code default: DEBUG)
# MARK is this engine's own level, so MARK records are written only when
# Level is MARK.
Level=INFO

# System name stored as system_name into every record and used for report /
# archive identification. This value is inherited from JsPlus-Core; set it to
# JsPlus-LogReplaced to tell this layer's records apart from the engine's.
SystemName=Core

# --- Output scheduling ------------------------------------------------------
# Batch flush interval: the buffered records are written this often
# (code default: 1000ms)
OutLogTimer=1s

# Ring-buffer capacity: once in-memory records reach this the oldest one is
# dropped; it also caps the size of a single flush batch
# (code default: 1000)
OutLogBatchLimit=100000

# --- Console output ---------------------------------------------------------
# Also write each record to stdout (code default: true)
SystemOut=true

# --- File output ------------------------------------------------------------
# Write records to log files under FileOutFolder (code default: false)
FileOut=true

# Rotate to the next file once a single file reaches this size
# (code default: 10mb)
FileOutMaxFileSize=5mb

# How many rotated files are kept before the oldest is reused
# (code default: 10)
FileOutMaxBackupIndex=1000

# Delete rotated files older than this many days
# (code default: 30)
FileOutArchiveDays=30

# Log file name; the text inside the backticks is the SimpleDateFormat pattern
# (code default: `yyyyMMdd`.log)
FileNameFormat=`yyyyMMdd`.log

# Log output folder; ${JS_PLUS_PATH} is substituted by the engine
# (code default: null -> <jar folder>/logs/)
FileOutFolder=${JS_PLUS_PATH}/../logs/app/

# --- Alert ------------------------------------------------------------------
# AlertMessage implementation class name; blank = alerts disabled
# (code default: blank)
AlertMessage.class=

# --- Log line format --------------------------------------------------------
# Single-line format. Placeholders: :level / :log_time_format / :hostname /
# :log_thread_name / :log_thread_id / :log_class_name / :log_method_name /
# :log_file_name / :log_line_number / :message / :stack_trace
# A Throwable is printed on its own line because of the literal \r\n.
# (code default: :level :log_time_format [:log_thread_name-:log_thread_id]
#   :log_class_name.:log_method_name(:log_file_name::log_line_number)
#   **:message** \r\n:stack_trace)
MessageFormat=:level :log_time_format [:hostname-:log_thread_name-:log_thread_id] :log_class_name **:message** \r\n:stack_trace

# ============================================================================
# Hidden optional keys
# Supported by the engine, absent from the default file above. Uncomment to
# activate; each entry states its code default and when it matters.
# ============================================================================

# --- Time format ------------------------------------------------------------
# Pattern for the time-of-day part (:log_time_format)
# (code default: yyyyMMdd HH:mm:ss.SSS)
#LogTimeFormat=yyyyMMdd HH:mm:ss.SSS

# Pattern for the day part (file name grouping / archive)
# (code default: yyyyMMdd)
#LogDateFormat=yyyyMMdd

# --- Class-name filter ------------------------------------------------------
# Only records whose :log_class_name matches this regex are written;
# blank or null = write everything (code default: null)
#ClassNameEnableRegex=

# Records whose :log_class_name matches this regex are skipped; blank or null =
# no filtering. Applied after ClassNameEnableRegex (code default: null)
#ClassNameDisableRegex=

# --- File header ------------------------------------------------------------
# Text written at the top of every newly created log file (rotation/archive)
# (code default: null = no header)
#MessageHeader=

# --- Alert ------------------------------------------------------------------
# Comma-separated level list that triggers AlertMessage.class
# (code default: DEBUG,INFO,WARN,ERROR,MARK)
#AlertMessage.level=DEBUG,INFO,WARN,ERROR,MARK

# --- Database output (DatabaseOut) ------------------------------------------
# Every flushed batch is inserted into app_logger_msg (dbscript/change.sql), so
# a log line becomes a queryable row. Enabled below against the local H2 anchor
# (config/DataSource.properties -> logdb).
#
# Batch records carry these :name parameters, any subset of which a statement
# may bind:
#   level, log_time, log_time_format, hostname, log_thread_name,
#   log_thread_id, log_class_name, log_method_name, log_file_name,
#   log_line_number, message, message_single, stack_trace, stack_trace_single,
#   exception, exception_class_name, exception_message, exception_message_single,
#   issued_class_name, issued_file_name, issued_method_name, issued_line_number,
#   system_name, id, created_at
# Three of them need care (measured against the engine source, not assumed):
#   * :created_at is a java.sql.Timestamp built at log time
#     (map.put("created_at", new java.sql.Timestamp(new Date().getTime()))), so it
#     binds straight into app_logger_msg.created_at / updated_at. Up to
#     jsplus-core 6.1.204 the same key held CommonTools.generateId(16) - a 16-char
#     id, not a timestamp - which is why the INSERT used to fall back to the
#     database's CURRENT_TIMESTAMP. That fallback is gone.
#   * :id is a real 16-character id and fits app_logger_msg.id CHAR(16).
#   * :log_thread_id is a long while app_logger_msg.thread_id is VARCHAR, hence
#     the CAST(:log_thread_id AS VARCHAR) in the INSERT.
DatabaseOut=true

# Datasource properties file used by the three statements below; read as a plain
# file path (new DriverDataSource(new File(value))). It must reach the same
# logdb that dbscript/change.sql was applied to.
DatabaseOutDataSource=${JS_PLUS_PATH}config/DataSource.properties

# INSERT - executed as a JDBC batch, one statement per record, split into
# DatabaseOutBatchLimit-sized chunks.
# LEFT(...,2000) on message / stack_trace is deliberate: app_logger_msg declares
# both as VARCHAR(2000) and H2 rejects longer values with 22001, which aborts the
# whole batch (measured: a 2020-character payload already fails). The full text
# is still written to the file log; only the database copy is capped.
#
# Timestamps come from the engine, never from the database: created_at and
# updated_at both bind :created_at, which Logger.log() puts into the record map as
# new java.sql.Timestamp(new Date().getTime()) - the instant the log call was
# made. DriverExecutor.converParams() turns any java.util.Date into a
# java.sql.Timestamp before setObject, so the driver receives a real timestamp
# parameter. A record is final once written, hence updated_at repeats created_at
# rather than asking the database for CURRENT_TIMESTAMP.
DatabaseOutInsertExecute=INSERT INTO app_logger_msg (id, app_name, logger_name, log_level, log_time, hostname, thread_name, thread_id, message, stack_trace, created_at, updated_at, deleted) VALUES (:id, :system_name, :log_class_name, :level, :log_time, :hostname, :log_thread_name, CAST(:log_thread_id AS VARCHAR), LEFT(:message, 2000), LEFT(:stack_trace, 2000), :created_at, :created_at, FALSE)

# SELECT - per-host overrides for level / class_name_enable_regex /
# class_name_disable_regex (the only keys the engine reads, see
# LogRecord.writeLogBatchToDatabase). Aggregated with MIN() on purpose: a plain
# SELECT returns no row for a host without a config row, first() then returns
# null and the caller dereferences it without a null check. MIN() always
# returns exactly one row, and a NULL level simply fails
# Logger.checkLevel(null), so the local Level above stays in force.
DatabaseOutConfigFrom=SELECT MIN(level) AS level, MIN(class_name_enable_regex) AS class_name_enable_regex, MIN(class_name_disable_regex) AS class_name_disable_regex FROM app_logger_config WHERE hostname = :hostname AND deleted = FALSE

# DELETE - clears rows older than the retention; hostname keeps one machine from
# deleting another machine's history.
#
# The cut-off comes from the engine, never from the database: the caller computes
#     archiveTime = System.currentTimeMillis()
#                    - DatabaseOutArchiveDays*24*3600*1000L
# and binds it as :archive_time (a java.sql.Timestamp). Retention is therefore
# controlled by DatabaseOutArchiveDays alone - one source of truth, nothing to
# keep in step by hand.
#
# Execution rate: since jsplus-core 6.1.210 this runs at most once per
# DatabaseOutArchiveTimer (default 60000 ms) instead of on every flush. A flush
# happens every OutLogTimer (~1/s), so before 6.1.210 the condition scan hit the
# table once a second.
#
# History: up to jsplus-core 6.1.204 the product above was written WITHOUT the L,
# in int arithmetic. 31*24*3600*1000 = 2678400000 exceeds Integer.MAX_VALUE
# (2147483647), so it wrapped negative, archive_time arrived in the FUTURE
# (measured: 2026-11-18 for a run on 2026-10-30) and the DELETE erased every row
# inserted in the same flush - app_logger_msg looked empty. Any retention of 25
# days or more overflowed (limit 24.8 days). jsplus-core 6.1.210 added the L, so
# that defect is fixed at the source and binding :archive_time is safe.
DatabaseOutArchiveExecute=DELETE FROM app_logger_msg WHERE hostname = :hostname AND log_time < :archive_time

# Rows per insert chunk (code default: 100)
#DatabaseOutBatchLimit=100

# Retention in days, consumed by the engine to build :archive_time (see above).
# This is the only place retention is configured: DatabaseOutArchiveExecute binds
# :archive_time, so changing the value here changes the real cut-off.
#DatabaseOutArchiveDays=31

# Archive frequency cap in ms (code default: 60000). Added in jsplus-core 6.1.210;
# a value <= 0 makes the condition scan run on every flush again.
#DatabaseOutArchiveTimer=60000

# Datasource reconnect back-off in ms (code default: 30000). Added in
# jsplus-core 6.1.210: while the datasource is null the engine retries at most
# this often instead of once per flush, so a DB outage no longer emits one error
# line per second.
#DatabaseOutRetryTimer=30000

# Remote-config poll interval in ms: DatabaseOutConfigFrom is re-read at most
# this often (code default: 60000)
#DatabaseOutRefreshConfigTimer=60000

