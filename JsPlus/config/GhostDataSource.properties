# NOTE (JsPlus-LogReplaced): this project's schema (dbscript/change.sql)
# ships app_logger_config / app_logger_msg and does NOT create the
# ghost_remote_command queue table. The ghost console started by
# StartH2.bat (-GhostName H2Ghost) therefore cannot poll a queue: it
# retries every GhostTimer and logs a system error, while the H2 TCP
# server itself keeps working. Restore the queue by adding its CREATE
# TABLE back to dbscript/change.sql (see JsPlus-Core).
GhostTable=ghost_remote_command
GhostTimer=500ms

ThreadName=JsPlus_LogReplaced_Ghost
DriverJar=

Driver=org.h2.Driver
Url=jdbc:h2:tcp://localhost:${H2_PORT}/logdb
Username=sample_user
Password=sample_password


TestValidTimeout=5s
RefreshPoolTimer=1s
IdleTimeout=4h
Timeout=4h
TransactionTimeout=4h
LifeCycle=1d
MinPoolSize=1
MaxPoolSize=100
ConnProps=autoReconnect=true
EnableFullStatusLog=false
EnableStatusLog=true
StatusLogFolder=${JS_PLUS_PATH}/../logs/DS/

SqlLogEnable=false
SqlLogFolder=${JS_PLUS_PATH}/../logs/SqlLog/
SqlLogArchiveDays=90
SqlLogParamMaxLength=200
SqlLogMaxFileSize=10mb
SqlLogIgnored=
SqlLogAllowed=
SqlLogOverspend=0s

SqlExecuteIgnored=
SqlExecuteAllowed=

